# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: pocketalert

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pocketalert
    main: ./cmd/pocketalert
    binary: pocketalert
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - id: default
    # No version in the name: /releases/latest/download/<name> then stays a
    # stable link for docs and install.sh.
    name_template: "pocketalert_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

brews:
  - name: pocketalert
    repository:
      owner: PocketAlert
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Releases still succeed before the tap repo and its token exist.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    directory: Formula
    homepage: https://pocketalert.app
    description: Send push notifications to your phone from the terminal
    license: MIT
    commit_author:
      name: pocketalert-bot
      email: info@pocketalert.app
    test: |
      system "#{bin}/pocketalert", "version"
    install: |
      bin.install "pocketalert"
      generate_completions_from_executable(bin/"pocketalert", "completion")

release:
  github:
    owner: PocketAlert
    name: cli
  footer: |
    **Install:** `curl -fsSL https://raw.githubusercontent.com/PocketAlert/cli/main/install.sh | sh`
    or download an archive below. Docs: https://info.pocketalert.app/cli
